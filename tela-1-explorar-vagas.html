<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estágio Fácil — Tela 1 · Explorar vagas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    /* Hide scrollbar inside phone frame for clean mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* =====================================================================
       WIREFRAME (BAIXA FIDELIDADE) OVERRIDES
       Strictly grayscale, dashed/solid structural blocks, wireframe feel
       ===================================================================== */
    .wireframe-mode {
      filter: grayscale(100%) contrast(105%);
    }

    .wireframe-mode .app-screen {
      background-color: #ffffff !important;
    }

    .wireframe-mode .wf-card {
      background-color: #f8fafc !important;
      border: 2px solid #94a3b8 !important;
      box-shadow: none !important;
    }

    .wireframe-mode .wf-btn-primary {
      background-color: #475569 !important;
      border: 2px solid #1e293b !important;
      box-shadow: none !important;
    }

    .wireframe-mode .wf-badge {
      background-color: #e2e8f0 !important;
      border: 1px dashed #64748b !important;
      color: #1e293b !important;
    }

    .wireframe-mode .wf-avatar-box {
      background-color: #cbd5e1 !important;
      border: 2px solid #64748b !important;
      position: relative;
      overflow: hidden;
    }

    /* Classic Wireframe 'X' cross inside avatar/logo boxes */
    .wireframe-mode .wf-avatar-box::before,
    .wireframe-mode .wf-avatar-box::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 1.5px;
      background-color: #64748b;
    }
    .wireframe-mode .wf-avatar-box::before {
      transform: rotate(45deg);
    }
    .wireframe-mode .wf-avatar-box::after {
      transform: rotate(-45deg);
    }
    .wireframe-mode .wf-avatar-box > * {
      opacity: 0;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 text-slate-900 select-none">
  <div id="ef-controls" class="w-full max-w-[390px] flex items-center justify-between gap-2 bg-white/90 border border-slate-300 rounded-2xl px-3 py-2 shadow-sm mb-4">
    <span class="text-[11px] font-bold text-slate-700">Tela 1 · Explorar vagas</span>
    <div class="flex items-center gap-2">
      <div class="inline-flex bg-slate-100 p-1 rounded-xl border border-slate-200">
        <button id="btn-lowfi" onclick="setFidelity('low')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-600">Wireframe</button>
        <button id="btn-highfi" onclick="setFidelity('high')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-600 text-white">UI Final</button>
      </div>
      <button onclick="resetPrototype()" class="text-[11px] font-semibold text-blue-600 hover:underline">Reiniciar</button>
    </div>
  </div>
  <!-- MAIN MOBILE DEVICE FRAME (390px x 844px) -->
  <div
    id="device-wrapper"
    class="relative w-full max-w-[390px] h-[844px] bg-[#F8FAFC] rounded-[46px] border-[10px] border-slate-900 shadow-2xl overflow-hidden flex flex-col transition-all duration-300"
  >
    <!-- iOS-style Status Bar & Dynamic Island -->
    <div class="w-full bg-white px-6 pt-3 pb-2 flex items-center justify-between text-[11px] font-semibold text-slate-800 shrink-0 z-20">
      <span>09:41</span>
      <div class="w-24 h-5 bg-slate-900 rounded-full"></div>
      <div class="flex items-center gap-1.5">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- TOAST NOTIFICATION BANNER (Inside Phone) -->
    <div
      id="app-toast"
      class="hidden absolute top-14 left-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2.5 text-xs font-medium animate-pop"
    >
      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
      <span id="app-toast-text">Candidatura enviada com sucesso!</span>
    </div>

    <div id="screen-1" class="app-screen flex-1 flex flex-col bg-[#F8FAFC] overflow-hidden">
      <!-- Top Header -->
      <div class="bg-white px-5 pt-2 pb-4 border-b border-slate-100 shrink-0">
        <div class="flex items-center justify-between mb-3">
          <div>
            <p class="text-xs text-slate-500 font-medium">Bom dia,</p>
            <h2 class="text-xl font-extrabold text-slate-900">Olá, Lucas 👋</h2>
          </div>
          <div class="wf-badge flex items-center gap-1.5 bg-blue-50 text-blue-700 border border-blue-100 px-3 py-1.5 rounded-full text-[11px] font-semibold">
            <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
            <span>ADS • 4º Período</span>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-3">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input
            id="search-input"
            type="text"
            oninput="renderJobs()"
            placeholder="Buscar cargo, empresa ou tecnologia..."
            class="w-full bg-slate-100 text-xs text-slate-800 placeholder-slate-400 pl-9 pr-4 py-2.5 rounded-xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition"
          />
        </div>

        <!-- Quick Filter Pills -->
        <div id="filter-pills" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
          <button onclick="setFilter('Todos')" data-filter="Todos" class="filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shrink-0">
            Todos
          </button>
          <button onclick="setFilter('ADS / TI')" data-filter="ADS / TI" class="filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">
            ADS / TI
          </button>
          <button onclick="setFilter('Turno Noite')" data-filter="Turno Noite" class="filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">
            Turno Noite
          </button>
          <button onclick="setFilter('Remoto')" data-filter="Remoto" class="filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">
            Remoto
          </button>
        </div>
      </div>

      <!-- Job Feed List -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">Vagas compatíveis com sua grade</span>
          <span id="jobs-count" class="text-[11px] font-medium text-slate-400">3 vagas</span>
        </div>

        <div id="jobs-container" class="space-y-3">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>
  <nav class="w-full bg-white border-t border-slate-200 px-6 py-2.5 flex items-center justify-around shrink-0 z-20">
      <button
        onclick="goToScreen(1)"
        id="nav-explorar"
        class="nav-item flex flex-col items-center gap-1 text-blue-600 font-bold text-[11px]"
      >
        <i data-lucide="compass" class="w-5 h-5"></i>
        <span>Explorar</span>
      </button>

      <button
        onclick="goToScreen(3)"
        id="nav-candidaturas"
        class="nav-item relative flex flex-col items-center gap-1 text-slate-400 font-medium text-[11px]"
      >
        <i data-lucide="briefcase" class="w-5 h-5"></i>
        <span>Candidaturas</span>
        <span id="nav-badge-count" class="absolute -top-1 right-2 w-4 h-4 rounded-full bg-blue-600 text-white text-[9px] font-bold flex items-center justify-center">
          1
        </span>
      </button>

      <button
        onclick="goToProfile()"
        id="nav-perfil"
        class="nav-item flex flex-col items-center gap-1 text-slate-400 font-medium text-[11px]"
      >
        <i data-lucide="user" class="w-5 h-5"></i>
        <span>Perfil</span>
      </button>
    </nav>

    <!-- Bottom Home Indicator Bar -->
    <div class="w-full bg-white pb-2 pt-0.5 flex justify-center shrink-0">
      <div class="w-32 h-1 bg-slate-900 rounded-full opacity-80"></div>
    </div>
  </div>

  
  <script>
    const CURRENT_NAV = 'nav-explorar';
        // Mock Data: 3 Realistic Internship Jobs
    const JOBS_DATA = [
      {
        id: 'job-1',
        title: 'Estágio em Desenvolvimento Front-end',
        company: 'CloudBridge Sistemas',
        initials: 'CB',
        bolsa: 'R$ 1.350/mês',
        shift: 'Tarde • 13h às 18h',
        tags: ['ADS / TI', 'Turno Noite', 'Remoto'],
        location: '100% Remoto',
        description:
          'Atue junto ao time de produto criando interfaces responsivas em React e Tailwind CSS, com mentoria semanal de desenvolvedores sêniores.',
        requirements: [
          'Cursando ADS, Ciência da Computação ou áreas afins (3º ao 5º período)',
          'Noções básicas de HTML, CSS, JavaScript e Git',
          'Disponibilidade no período da tarde (compatível com aulas noturnas)'
        ],
        benefits: ['Bolsa-auxílio de R$ 1.350,00', 'Auxílio Home Office (R$ 150)', 'Recesso remunerado e seguro de vida']
      },
      {
        id: 'job-2',
        title: 'Estágio em Suporte e Dados (BI)',
        company: 'Finanças Ágil S.A.',
        initials: 'FA',
        bolsa: 'R$ 1.200/mês',
        shift: 'Manhã • 08h às 13h',
        tags: ['ADS / TI', 'Turno Noite'],
        location: 'Híbrido • Centro',
        description:
          'Apoio na criação de dashboards gerenciais, consultas SQL e automação de relatórios internos para a equipe de operações.',
        requirements: [
          'Estar matriculado em curso superior de Tecnologia',
          'Conhecimento intermediário em Excel e lógica de programação',
          'Boa comunicação e vontade de aprender'
        ],
        benefits: ['Bolsa-auxílio de R$ 1.200,00', 'Vale-transporte integral', 'Vale-refeição (R$ 28/dia)']
      },
      {
        id: 'job-3',
        title: 'Estágio em QA & Testes de Software',
        company: 'Nexus Educacional',
        initials: 'NX',
        bolsa: 'R$ 1.250/mês',
        shift: 'Tarde • 13h às 18h',
        tags: ['ADS / TI', 'Remoto'],
        location: '100% Remoto',
        description:
          'Execução de testes manuais e automatizados em plataformas de ensino, garantindo a qualidade antes de cada nova versão.',
        requirements: [
          'Cursando a partir do 2º período de Sistemas ou Engenharia de Software',
          'Olhar analítico para identificar falhas de usabilidade',
          'Disponibilidade de 25h semanais'
        ],
        benefits: ['Bolsa-auxílio de R$ 1.250,00', 'Horário flexível em semana de provas', 'Possibilidade de efetivação']
      }
    ];

    // Prototype State
    let currentFidelity = 'high';
    let currentFilter = 'Todos';
    let selectedJobId = 'job-1';
    let contractSigned = false;

    // Active applications list (Screen 3)
    let myApplications = [
      {
        id: 'app-approved',
        title: 'Estágio em Desenvolvimento Web',
        company: 'TechNova Soluções Digitais',
        bolsa: 'R$ 1.400/mês',
        status: 'Aprovado pelo RH - Assinar Contrato',
        progress: 85,
        isApproved: true
      }
    ];

    const QS = new URLSearchParams(location.search);
    (function () {
      try {
        const s = JSON.parse(QS.get('s') || 'null');
        if (s) { selectedJobId = s.j || selectedJobId; contractSigned = !!s.c; if (s.a) myApplications = s.a; }
      } catch (e) {}
      if (QS.get('vaga')) selectedJobId = QS.get('vaga');
    })();
    let pendingToast = '';
    function go(file) {
      const q = new URLSearchParams(location.search);
      q.delete('vaga'); q.delete('t');
      q.set('s', JSON.stringify({ j: selectedJobId, c: contractSigned, a: myApplications }));
      if (pendingToast) q.set('t', pendingToast);
      location.href = file + '?' + q.toString();
    }
    // Switch between Low-Fidelity Wireframe and High-Fidelity UI
    function setFidelity(mode) {
      currentFidelity = mode;
      const wrapper = document.getElementById('device-wrapper');
      const btnLow = document.getElementById('btn-lowfi');
      const btnHigh = document.getElementById('btn-highfi');

      if (mode === 'low') {
        wrapper.classList.add('wireframe-mode');
        btnLow.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-white shadow-sm';
        btnHigh.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900';
      } else {
        wrapper.classList.remove('wireframe-mode');
        btnHigh.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-blue-600 text-white shadow-sm';
        btnLow.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900';
      }
    }

    // Filter Pills Handler (Screen 1)
    function setFilter(filterName) {
      currentFilter = filterName;
      document.querySelectorAll('.filter-pill').forEach((btn) => {
        if (btn.dataset.filter === filterName) {
          btn.className = 'filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shrink-0';
        } else {
          btn.className = 'filter-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0';
        }
      });
      renderJobs();
    }

    // Render Job Cards on Screen 1
    function renderJobs() {
      const container = document.getElementById('jobs-container');
      if (!container) return;
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = JOBS_DATA.filter((job) => {
        const matchesFilter = currentFilter === 'Todos' || job.tags.includes(currentFilter);
        const matchesQuery =
          !query ||
          job.title.toLowerCase().includes(query) ||
          job.company.toLowerCase().includes(query);
        return matchesFilter && matchesQuery;
      });

      document.getElementById('jobs-count').textContent = `${filtered.length} ${filtered.length === 1 ? 'vaga' : 'vagas'}`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="wf-card bg-white rounded-2xl p-6 text-center border border-slate-200">
            <p class="text-xs font-bold text-slate-700">Nenhuma vaga encontrada</p>
            <p class="text-[11px] text-slate-400 mt-1">Tente limpar os filtros acima.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered
        .map(
          (job) => `
          <div
            onclick="openJobDetail('${job.id}')"
            class="wf-card bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm hover:border-blue-400 active:scale-[0.99] transition cursor-pointer"
          >
            <div class="flex items-start justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2.5">
                <div class="wf-avatar-box w-10 h-10 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">
                  <span>${job.initials}</span>
                </div>
                <div>
                  <h3 class="text-xs font-extrabold text-slate-900 leading-snug">${job.title}</h3>
                  <p class="text-[11px] text-slate-500 font-medium">${job.company}</p>
                </div>
              </div>
            </div>

            <!-- Bolsa + Shift Badges -->
            <div class="flex flex-wrap items-center gap-1.5 mb-3">
              <span class="wf-badge px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-extrabold text-[11px]">
                ${job.bolsa}
              </span>
              <span class="wf-badge px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold text-[11px]">
                ${job.shift}
              </span>
            </div>

            <!-- Institutional Validation Footer -->
            <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between">
              <span class="wf-badge inline-flex items-center gap-1 text-[10px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md">
                <i data-lucide="shield-check" class="w-3 h-3"></i>
                Validada pela Faculdade
              </span>
              <span class="text-[11px] font-bold text-blue-600 flex items-center gap-0.5">
                Ver vaga <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
              </span>
            </div>
          </div>
        `
        )
        .join('');

      lucide.createIcons();
    }

    // Open Screen 2 with selected job data
    function openJobDetail(jobId) {
      selectedJobId = jobId;
      goToScreen(2);
    }

    function renderJobDetail() {
      const job = JOBS_DATA.find((j) => j.id === selectedJobId) || JOBS_DATA[0];
      const alreadyApplied = myApplications.some((a) => a.id === job.id);

      const content = document.getElementById('job-detail-content');
      if (!content) return;
      content.innerHTML = `
        <div class="wf-card bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <div class="wf-avatar-box w-12 h-12 rounded-2xl bg-slate-900 text-white font-extrabold text-sm flex items-center justify-center shrink-0">
              <span>${job.initials}</span>
            </div>
            <div>
              <h3 class="text-sm font-extrabold text-slate-900 leading-tight">${job.title}</h3>
              <p class="text-xs text-slate-500 font-medium mt-0.5">${job.company} • ${job.location}</p>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mb-3">
            <span class="wf-badge px-3 py-1 rounded-xl bg-emerald-50 text-emerald-700 font-extrabold text-xs">
              ${job.bolsa}
            </span>
            <span class="wf-badge px-3 py-1 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs">
              ${job.shift}
            </span>
          </div>

          <div class="wf-badge bg-blue-50 border border-blue-100 rounded-xl p-2.5 flex items-center gap-2 text-blue-800 text-[11px] font-semibold">
            <i data-lucide="shield-check" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <span>Validada pela Faculdade: compatível com sua grade noturna.</span>
          </div>
        </div>

        <div class="wf-card bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
          <h4 class="text-xs font-extrabold text-slate-900">Sobre a oportunidade</h4>
          <p class="text-xs text-slate-600 leading-relaxed">${job.description}</p>
        </div>

        <div class="wf-card bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
          <h4 class="text-xs font-extrabold text-slate-900">Requisitos</h4>
          <ul class="space-y-1.5 text-xs text-slate-600">
            ${job.requirements.map((r) => `<li class="flex items-start gap-2"><span class="text-blue-600 font-bold">•</span><span>${r}</span></li>`).join('')}
          </ul>
        </div>

        <div class="wf-card bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
          <h4 class="text-xs font-extrabold text-slate-900">Benefícios</h4>
          <ul class="space-y-1.5 text-xs text-slate-600">
            ${job.benefits.map((b) => `<li class="flex items-start gap-2"><span class="text-emerald-600 font-bold">✓</span><span>${b}</span></li>`).join('')}
          </ul>
        </div>
      `;

      const applyBtn = document.getElementById('btn-apply-job');
      if (alreadyApplied) {
        applyBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Candidatura já enviada — Ver status</span>`;
      } else {
        applyBtn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i><span>Candidatar-se em 1 clique</span>`;
      }

      lucide.createIcons();
    }

    // Apply in 1 click -> Add to Screen 3 -> Toast -> Navigate to Screen 3
    function applyToCurrentJob() {
      const job = JOBS_DATA.find((j) => j.id === selectedJobId) || JOBS_DATA[0];
      const alreadyApplied = myApplications.some((a) => a.id === job.id);

      if (!alreadyApplied) {
        myApplications.unshift({
          id: job.id,
          title: job.title,
          company: job.company,
          bolsa: job.bolsa,
          status: 'Em análise pelo RH',
          progress: 25,
          isApproved: false
        });
        pendingToast = 'Candidatura enviada em 1 clique!';
      }

      renderApplications();
      goToScreen(3);
    }

    // Render Screen 3 (Minhas Candidaturas)
    function renderApplications() {
      const container = document.getElementById('applications-container');
      document.getElementById('nav-badge-count').textContent = myApplications.length;
      if (!container) return;

      container.innerHTML = myApplications
        .map((app) => {
          if (app.isApproved) {
            return `
              <div
                onclick="goToScreen(4)"
                class="wf-card bg-white rounded-2xl p-4 border-2 border-emerald-500/70 shadow-sm cursor-pointer active:scale-[0.99] transition"
              >
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="wf-badge px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-extrabold">
                    ${contractSigned ? 'Contrato Assinado ✓' : 'Aprovado pelo RH - Assinar Contrato'}
                  </span>
                  <span class="text-xs font-bold text-slate-700">${app.bolsa}</span>
                </div>

                <h3 class="text-xs font-extrabold text-slate-900">${app.title}</h3>
                <p class="text-[11px] text-slate-500 mb-3">${app.company}</p>

                <!-- Progress Bar -->
                <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-2">
                  <div class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: ${contractSigned ? '100%' : '85%'}"></div>
                </div>

                <div class="flex items-center justify-between text-[11px]">
                  <span class="text-slate-500 font-medium">Etapa 4 de 4</span>
                  <span class="font-bold text-blue-600 flex items-center gap-0.5">
                    ${contractSigned ? 'Ver contrato' : 'Assinar agora'} <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                  </span>
                </div>
              </div>
            `;
          }

          return `
            <div class="wf-card bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="wf-badge px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-bold">
                  Em análise
                </span>
                <span class="text-xs font-bold text-emerald-600">${app.bolsa}</span>
              </div>

              <h3 class="text-xs font-extrabold text-slate-900">${app.title}</h3>
              <p class="text-[11px] text-slate-500 mb-3">${app.company}</p>

              <!-- Progress Bar -->
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-2">
                <div class="h-full bg-blue-600 rounded-full" style="width: 30%"></div>
              </div>

              <div class="flex items-center justify-between text-[11px] text-slate-500">
                <span>Currículo recebido pelo RH</span>
                <span class="font-semibold">Hoje</span>
              </div>
            </div>
          `;
        })
        .join('');

      lucide.createIcons();
    }

    // Screen 5: Sign Digital Contract (TCE)
    function applyContractUI() {
      if (!contractSigned) return;
      const $ = (id) => document.getElementById(id);
      if ($('tce-success-banner')) $('tce-success-banner').classList.remove('hidden');
      if ($('student-sign-badge')) {
        $('student-sign-badge').textContent = 'Assinado ✓';
        $('student-sign-badge').className = 'wf-badge px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold';
      }
      if ($('student-sign-sub')) $('student-sign-sub').textContent = 'Assinado digitalmente agora';
      if ($('btn-sign-tce')) {
        $('btn-sign-tce').innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i><span>Documento Validado e Concluído</span>`;
        $('btn-sign-tce').className = 'wf-btn-primary w-full py-3.5 rounded-2xl bg-slate-800 text-white font-bold text-sm flex items-center justify-center gap-2 cursor-default';
      }
      if ($('timeline-tce-icon')) {
        $('timeline-tce-icon').className = 'absolute -left-7 w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm';
        $('timeline-tce-icon').innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i>`;
        $('timeline-tce-title').textContent = 'TCE Assinado pelas 3 partes ✓';
        $('timeline-tce-title').className = 'text-xs font-extrabold text-emerald-700';
        $('timeline-tce-desc').textContent = 'Contratação formalizada! Você já pode iniciar suas atividades.';
      }
      lucide.createIcons();
    }

    function signContract() {
      if (contractSigned) return;
      contractSigned = true;
      applyContractUI();
      renderApplications();
      showToast('Termo de Compromisso assinado digitalmente!');
    }

    // Navigation Controller (uma página por tela)
    const PAGES = {
      1: 'tela-1-explorar-vagas.html',
      2: 'tela-2-detalhes-da-vaga.html',
      3: 'tela-3-minhas-candidaturas.html',
      4: 'tela-4-linha-do-tempo.html',
      5: 'tela-5-contrato-tce.html',
      profile: 'tela-6-perfil.html'
    };
    function goToScreen(num) { go(PAGES[num]); }
    function goToProfile() { go(PAGES.profile); }
    function setNav(id) {
      document.querySelectorAll('.nav-item').forEach((item) => {
        item.classList.remove('text-blue-600', 'font-bold');
        item.classList.add('text-slate-400', 'font-medium');
      });
      const n = document.getElementById(id);
      if (n) { n.classList.add('text-blue-600', 'font-bold'); n.classList.remove('text-slate-400', 'font-medium'); }
    }

    function showToast(msg) {
      const toast = document.getElementById('app-toast');
      document.getElementById('app-toast-text').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }

    function resetPrototype() {
      const q = new URLSearchParams(location.search);
      ['s', 't', 'vaga'].forEach((p) => q.delete(p));
      location.href = PAGES[1] + '?' + q.toString();
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      setFidelity(QS.get('modo') === 'wireframe' ? 'low' : 'high');
      if (QS.get('ui') === '0') document.getElementById('ef-controls').classList.add('hidden');
      setNav(CURRENT_NAV);
      renderJobs(); renderJobDetail(); renderApplications(); applyContractUI();
      if (QS.get('t')) showToast(QS.get('t'));
      lucide.createIcons();
    });
    
  </script>
</body>
</html>
